<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- nigiri rice base -->
  <ellipse cx="100" cy="130" rx="76" ry="34" fill="#fbf5e8" stroke="#b08a5b" stroke-width="3"/>
  <!-- salmon top -->
  <path d="M 30 116 Q 100 70 170 116 Q 170 132 100 132 Q 30 132 30 116 Z"
        fill="#f08a6e" stroke="#a8543c" stroke-width="3"/>
  <!-- white veining on salmon -->
  <path d="M 50 110 Q 100 96 150 110" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <path d="M 60 100 Q 100 88 140 100" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <!-- nori belt -->
  <rect x="86" y="100" width="28" height="52" fill="#3a4a3a" stroke="#1a2a1a" stroke-width="2"/>
  <!-- shine -->
  <ellipse cx="80" cy="92" rx="14" ry="3" fill="#fff" opacity="0.5"/>
</svg>
