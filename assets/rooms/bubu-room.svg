<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7fb"/>
      <stop offset="1" stop-color="#d8caf2"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a37f"/>
      <stop offset="1" stop-color="#8e7355"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="1" stop-color="#f3d985"/>
    </linearGradient>
    <linearGradient id="curtain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a4e4"/>
      <stop offset="1" stop-color="#a880cf"/>
    </linearGradient>
    <pattern id="floorPlanks2" x="0" y="0" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="url(#floor2)"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#5e4830" stroke-width="2" opacity="0.4"/>
      <line x1="0" y1="40" x2="120" y2="40" stroke="#5e4830" stroke-width="1.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Wall -->
  <rect x="0" y="0" width="1600" height="700" fill="url(#wall2)"/>
  <!-- Floor -->
  <rect x="0" y="700" width="1600" height="300" fill="url(#floorPlanks2)"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#7d6549" stroke-width="3"/>

  <!-- Pastel curtains across top -->
  <g>
    <path d="M 60 0 Q 90 200 110 200 L 110 0 Z" fill="url(#curtain2)"/>
    <path d="M 1490 0 Q 1510 200 1540 200 L 1540 0 Z" fill="url(#curtain2)"/>
    <path d="M 110 0 L 1490 0 L 1480 60 Q 800 100 130 60 Z" fill="#c8a4e4" opacity="0.8"/>
  </g>

  <!-- Framed Dudu portrait (top center) -->
  <g transform="translate(700,90)">
    <rect x="0" y="0" width="200" height="160" rx="10" fill="#fff" stroke="#5e4830" stroke-width="6"/>
    <rect x="14" y="14" width="172" height="132" fill="#fff5da"/>
    <!-- simple Dudu silhouette -->
    <ellipse cx="100" cy="90" rx="50" ry="42" fill="#a87b5c"/>
    <circle cx="76" cy="60" r="14" fill="#a87b5c"/>
    <circle cx="124" cy="60" r="14" fill="#a87b5c"/>
    <circle cx="84" cy="86" r="5" fill="#3a2a1a"/>
    <circle cx="116" cy="86" r="5" fill="#3a2a1a"/>
    <ellipse cx="100" cy="100" rx="6" ry="4" fill="#3a2a1a"/>
    <text x="74" y="138" font-size="14" fill="#7e6650" font-family="serif">★ Dudu ★</text>
  </g>

  <!-- Bookshelf on left (Dudu plushie hides here) -->
  <g>
    <rect x="150" y="240" width="280" height="380" rx="6" fill="#7e6650"/>
    <rect x="158" y="252" width="264" height="356" fill="#a48870"/>
    <line x1="158" y1="350" x2="422" y2="350" stroke="#5e4830" stroke-width="4"/>
    <line x1="158" y1="450" x2="422" y2="450" stroke="#5e4830" stroke-width="4"/>
    <line x1="158" y1="550" x2="422" y2="550" stroke="#5e4830" stroke-width="4"/>
    <!-- books -->
    <g transform="translate(170,260)">
      <rect x="0" y="0" width="20" height="84" fill="#d96b6b"/>
      <rect x="22" y="0" width="20" height="84" fill="#7e9ec9"/>
      <rect x="44" y="0" width="20" height="84" fill="#a4c47b"/>
      <rect x="66" y="0" width="20" height="84" fill="#e2a9b3"/>
      <rect x="88" y="0" width="20" height="84" fill="#f3d985"/>
    </g>
    <g transform="translate(170,360)">
      <rect x="0" y="0" width="20" height="84" fill="#7e9ec9"/>
      <rect x="22" y="0" width="20" height="84" fill="#d96b6b"/>
      <rect x="44" y="0" width="20" height="84" fill="#a4c47b"/>
      <!-- gap intentional, plushie may hide here -->
    </g>
    <g transform="translate(170,460)">
      <rect x="0" y="0" width="20" height="84" fill="#a4c47b"/>
      <rect x="22" y="0" width="20" height="84" fill="#e2a9b3"/>
      <rect x="44" y="0" width="20" height="84" fill="#7e9ec9"/>
      <rect x="66" y="0" width="20" height="84" fill="#d96b6b"/>
      <rect x="88" y="0" width="20" height="84" fill="#f3d985"/>
      <rect x="110" y="0" width="20" height="84" fill="#7e9ec9"/>
    </g>
    <g transform="translate(170,560)">
      <rect x="0" y="0" width="20" height="44" fill="#d96b6b"/>
      <rect x="22" y="0" width="20" height="44" fill="#a4c47b"/>
      <rect x="44" y="0" width="20" height="44" fill="#e2a9b3"/>
    </g>
  </g>

  <!-- Vanity on the right -->
  <g>
    <rect x="1200" y="380" width="280" height="240" rx="8" fill="#a48870"/>
    <rect x="1200" y="380" width="280" height="20" fill="#7e6650"/>
    <!-- mirror -->
    <ellipse cx="1340" cy="300" rx="80" ry="100" fill="#fff" stroke="#7e6650" stroke-width="6"/>
    <ellipse cx="1340" cy="300" rx="68" ry="86" fill="#dde9f2"/>
    <!-- bottle -->
    <rect x="1230" y="356" width="22" height="34" rx="4" fill="#e2a9b3"/>
    <rect x="1228" y="350" width="26" height="10" rx="3" fill="#7e6650"/>
    <!-- jar -->
    <rect x="1430" y="356" width="34" height="32" rx="6" fill="#bdd1ea"/>
  </g>

  <!-- Tea tray with sushi (low table on the lower-left/center) -->
  <g>
    <!-- table -->
    <rect x="500" y="760" width="220" height="20" fill="#7e6650"/>
    <rect x="510" y="780" width="14" height="120" fill="#7e6650"/>
    <rect x="696" y="780" width="14" height="120" fill="#7e6650"/>
    <!-- tea cup -->
    <ellipse cx="540" cy="755" rx="22" ry="8" fill="#fff"/>
    <rect x="518" y="734" width="44" height="22" rx="4" fill="#fff" stroke="#a880cf" stroke-width="2"/>
    <ellipse cx="540" cy="734" rx="22" ry="6" fill="#a4c47b"/>
    <!-- sushi plate -->
    <ellipse cx="660" cy="755" rx="40" ry="10" fill="#fff"/>
  </g>

  <!-- Floor cushion -->
  <g>
    <ellipse cx="900" cy="860" rx="120" ry="36" fill="#d8c4f4"/>
    <ellipse cx="900" cy="850" rx="110" ry="28" fill="#e9dcfb"/>
  </g>

  <!-- Bed corner (right) -->
  <g>
    <rect x="1380" y="700" width="220" height="180" fill="#a48870"/>
    <rect x="1380" y="690" width="220" height="20" fill="#7e6650"/>
    <rect x="1390" y="700" width="200" height="80" rx="10" fill="#fff5da"/>
    <rect x="1400" y="730" width="180" height="44" rx="8" fill="#c8a4e4"/>
  </g>

  <!-- A few wall sparkles -->
  <g opacity="0.7" fill="#fff">
    <circle cx="500" cy="180" r="3"/>
    <circle cx="1100" cy="240" r="3"/>
    <circle cx="950" cy="380" r="2.5"/>
    <circle cx="1400" cy="540" r="3"/>
  </g>

  <!-- Wall art: tiny heart -->
  <g transform="translate(1080,180)">
    <path d="M 0 10 C 0 0, 14 -2, 14 10 C 14 -2, 28 0, 28 10 L 14 28 Z" fill="#e88da6"/>
  </g>
</svg>
