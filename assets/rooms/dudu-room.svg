  <!-- Wall/floor edge -->
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#a87a4f" stroke-width="3"/>

  <!-- Window (left) -->
  <g>
    <rect x="120" y="80" width="320" height="240" rx="14" fill="#fff" stroke="#9c6f4a" stroke-width="6"/>
    <rect x="135" y="95" width="290" height="210" rx="6" fill="url(#window)"/>
    <line x1="280" y1="95" x2="280" y2="305" stroke="#9c6f4a" stroke-width="5"/>
    <line x1="135" y1="200" x2="425" y2="200" stroke="#9c6f4a" stroke-width="5"/>
    <!-- Cloud -->
