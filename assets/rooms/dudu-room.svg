    <circle cx="600" cy="170" r="18" fill="#e8a460"/>
    <polygon points="586,158 590,172 598,160" fill="#e8a460"/>
    <polygon points="614,158 610,172 602,160" fill="#e8a460"/>
    <!-- figurine 2 (different color) -->
