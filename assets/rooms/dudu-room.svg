    <ellipse cx="232" cy="155" rx="28" ry="18" fill="#fff" opacity="0.9"/>
    <!-- Sun rays -->
    <circle cx="370" cy="150" r="22" fill="#ffe28a" opacity="0.85"/>
  </g>

  <!-- Curtains -->
  <path d="M 80 70 Q 110 320 130 320 L 130 80 Z" fill="#e2a9b3"/>
  <path d="M 460 70 Q 430 320 410 320 L 410 80 Z" fill="#e2a9b3"/>

  <!-- Wall art: cat picture frame (right side) -->
  <g transform="translate(1180,120)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="#fff" stroke="#7c5530" stroke-width="6"/>
    <rect x="14" y="14" width="152" height="112" fill="#ffe9c8"/>
