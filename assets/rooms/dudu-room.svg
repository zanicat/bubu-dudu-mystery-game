    <rect x="1200" y="540" width="370" height="200" rx="12" fill="#9c6f4a"/>
    <!-- mattress -->
    <rect x="1210" y="500" width="350" height="100" rx="14" fill="url(#bed)"/>
    <!-- blanket -->
